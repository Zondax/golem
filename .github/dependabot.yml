# Grouped updates so we do not get one PR per OTel exporter.
# No target-branch: security updates always open against the default
# branch, and setting it produced duplicate PRs on other repos.

version: 2
updates:
  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    groups:
      go-core:
        applies-to: version-updates
        patterns:
          - 'golang.org/x/*'
          - 'google.golang.org/*'
      go-core-security:
        applies-to: security-updates
        patterns:
          - 'golang.org/x/*'
          - 'google.golang.org/*'
      opentelemetry:
        applies-to: version-updates
        patterns:
          - 'go.opentelemetry.io/*'
      opentelemetry-security:
        applies-to: security-updates
        patterns:
          - 'go.opentelemetry.io/*'
      google-cloud:
        applies-to: version-updates
        patterns:
          - 'cloud.google.com/*'
      database:
        applies-to: version-updates
        patterns:
          - 'gorm.io/*'
          - 'github.com/ClickHouse/*'
          - 'github.com/jackc/pgx/*'
      go-minor-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'ci'
      include: 'scope'
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
